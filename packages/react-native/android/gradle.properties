org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Versioned native artifacts. Set INTH_MAVEN_URL and credentials for the pilot repository.
inth.core.group=com.inth
inth.core.version=3.0.0-alpha.1

# Where the bridge gets its NativeInthSpec. auto and stub compile the hand-written
# stand-in in inth-spec/src/main/java. codegen runs @react-native/codegen over
# ../src/specs into inth-spec/build/generated and compiles that instead, so this
# repository can run React Native's generator against its own spec. Generated output
# stays inside that module either way: inth-spec reaches the bridge as compileOnly,
# so the class is in no AAR. See inth-spec/build.gradle.kts, and the drift check in
# ../src/specs/__tests__/android-spec-surface.test.ts.
inth.spec.source=auto
# Override when node/react-native live somewhere Gradle cannot guess.
# inth.nodeExecutable=node
# inth.reactNativeDir=../../../node_modules/react-native
# The project Codegen reads package.json/node_modules from (default: the package root).
# inth.codegenProjectRoot=.
inth.reactNativeVersion=0.87.1

compileSdkVersion=36
minSdkVersion=24
