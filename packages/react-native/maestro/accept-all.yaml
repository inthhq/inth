# Waits for the Inth first-layer prompt and taps Accept all.
# Fails if the prompt does not appear within INTH_TIMEOUT milliseconds
# (default 15000). Use dismiss-if-shown.yaml when the prompt is optional.
#
#   - runFlow: ../node_modules/@inth/react-native/maestro/accept-all.yaml
# Maestro needs an appId in every flow file; the calling flow's appId is used.
appId: ${APP_ID}
---
# The headline is at the top of the page at every text size; the button can
# start below the fold at accessibility sizes, so scroll to it. Done means the
# whole page has gone, which scrolling cannot fake.
- extendedWaitUntil:
    visible:
      id: 'inth.first-layer.title'
    timeout: ${INTH_TIMEOUT || 15000}
- scrollUntilVisible:
    element:
      id: 'inth.first-layer.accept-all'
    direction: DOWN
- tapOn:
    id: 'inth.first-layer.accept-all'
- extendedWaitUntil:
    notVisible:
      id: 'inth.first-layer'
    timeout: ${INTH_TIMEOUT || 15000}
