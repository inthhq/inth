# Taps Save in c15t preferences, category or IAB, and waits for the
# preferences to close.
#
#   - runFlow: ../node_modules/@c15t/react-native/maestro/save-preferences.yaml
# Maestro needs an appId in every flow file; the calling flow's appId is used.
appId: ${APP_ID}
---
- tapOn:
    id: "c15t\\.(prefs|iab)\\.save"
- extendedWaitUntil:
    notVisible:
      id: "c15t\\.(prefs|iab)\\.save"
    timeout: ${C15T_TIMEOUT || 15000}
