# Leaves Inth preferences without saving: taps Back, Cancel or Close, and
# confirms Discard if there were unsaved changes. Preferences opened from the
# first layer return to it; preferences opened from the app close.
#
#   - runFlow: ../node_modules/@inth/react-native/maestro/close-preferences.yaml
# Maestro needs an appId in every flow file; the calling flow's appId is used.
appId: ${APP_ID}
---
- tapOn:
    id: 'inth.prefs.cancel'
- runFlow:
    when:
      visible:
        id: 'inth.prefs.discard.confirm'
    commands:
      - tapOn:
          id: 'inth.prefs.discard.confirm'
- extendedWaitUntil:
    notVisible:
      id: "inth\\.(prefs|iab)\\.save"
    timeout: ${C15T_TIMEOUT || 15000}
