# Answers the Inth consent prompt if it appears, then carries on.
#
# Waits up to INTH_TIMEOUT milliseconds (default 10000) for the first-layer
# prompt or the notice. The prompt gets Reject all unless INTH_CHOICE is
# accept-all; the notice gets Got it. With neither on screen the flow passes,
# so it is safe at the start of every test.
#
#   - runFlow:
#       file: ../node_modules/@inth/react-native/maestro/dismiss-if-shown.yaml
#       env:
#         INTH_CHOICE: accept-all
# Maestro needs an appId in every flow file; the calling flow's appId is used.
appId: ${APP_ID}
---
# Wait for the first-layer headline or the notice card, not the buttons: at
# accessibility text sizes the buttons start below the fold, where Maestro
# does not see them.
- extendedWaitUntil:
    visible:
      id: "inth\\.(first-layer\\.title|notice)"
    timeout: ${INTH_TIMEOUT || 10000}
    optional: true
- runFlow:
    when:
      visible:
        id: 'inth.first-layer.title'
    commands:
      - scrollUntilVisible:
          element:
            id: "inth.first-layer.${INTH_CHOICE || 'reject-all'}"
          direction: DOWN
      - tapOn:
          id: "inth.first-layer.${INTH_CHOICE || 'reject-all'}"
      - extendedWaitUntil:
          notVisible:
            id: 'inth.first-layer'
          timeout: ${INTH_TIMEOUT || 10000}
- runFlow:
    when:
      visible:
        id: 'inth.notice'
    commands:
      - scrollUntilVisible:
          element:
            id: 'inth.notice.acknowledge'
          direction: DOWN
      - tapOn:
          id: 'inth.notice.acknowledge'
      - extendedWaitUntil:
          notVisible:
            id: 'inth.notice'
          timeout: ${INTH_TIMEOUT || 10000}
