pluginManagement {
    repositories {
        google { content { includeGroupAndSubgroups('com.android'); includeGroupAndSubgroups('com.google'); includeGroupAndSubgroups('androidx') } }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google { content { includeGroupAndSubgroups('com.android'); includeGroupAndSubgroups('com.google'); includeGroupAndSubgroups('androidx') } }
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(providers.gradleProperty('inth.repository').get())
                    if (url.scheme == 'https') {
                        credentials {
                            username = System.getenv('INTH_MAVEN_USERNAME')
                            password = System.getenv('INTH_MAVEN_TOKEN')
                        }
                    }
                }
            }
            filter { includeGroup('com.inth') }
        }
    }
}
rootProject.name = 'inth-artifact-consumer'
include ':headless', ':app'
if (file('../node_modules/@inth/react-native').isDirectory()) {
    include ':inth-react-native'
    project(':inth-react-native').projectDir = file('../node_modules/@inth/react-native/android/inth-react-native')
}
