plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.c15t.consumer'
    compileSdk providers.gradleProperty('compileSdkVersion').get().toInteger()
    defaultConfig { applicationId 'com.c15t.consumer'; minSdk 24; targetSdk 36; versionCode 1; versionName '1' }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation "com.c15t:c15t-android:${providers.gradleProperty('c15t.core.version').get()}"
    if (findProject(':c15t-react-native') != null) {
        implementation project(':c15t-react-native')
        implementation "com.facebook.react:react-android:${providers.gradleProperty('c15t.reactNativeVersion').get()}"
    }
}
