plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.inth.consumer'
    compileSdk providers.gradleProperty('compileSdkVersion').get().toInteger()
    defaultConfig { applicationId 'com.inth.consumer'; minSdk 24; targetSdk 36; versionCode 1; versionName '1' }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation "com.inth:inth-android:${providers.gradleProperty('inth.core.version').get()}"
    if (findProject(':inth-react-native') != null) {
        implementation project(':inth-react-native')
        implementation "com.facebook.react:react-android:${providers.gradleProperty('inth.reactNativeVersion').get()}"
    }
}
