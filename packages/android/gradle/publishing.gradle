// Shared by the headless JVM and Android publications. Remote publication is opt-in.
def nativeVersion = providers.gradleProperty('inth.native.version').get()
def artifactName = project.name
def centralPublication = providers.environmentVariable('INTH_MAVEN_CENTRAL').orNull == 'true'
def privatePublication = providers.environmentVariable('INTH_MAVEN_PUBLISH').orNull == 'true'
if (centralPublication && privatePublication) {
	throw new GradleException('Choose Maven Central or the private pilot publication, not both.')
}
group = 'com.inth'
version = nativeVersion

publishing {
	repositories {
		maven {
			name = 'staging'
			url = rootProject.layout.buildDirectory.dir('maven-staging')
		}
		if (privatePublication) {
			maven {
				name = 'privateGitHub'
				url = uri('https://maven.pkg.github.com/inthhq/inth')
				credentials {
					username = providers.environmentVariable('INTH_MAVEN_USERNAME').orNull
					password = providers.environmentVariable('INTH_MAVEN_TOKEN').orNull
				}
			}
		}
	}
}

def apiDocs = tasks.register('apiDocsJar', Jar) {
	dependsOn 'dokkaGeneratePublicationHtml'
	archiveClassifier = 'javadoc'
	from layout.buildDirectory.dir('dokka/html')
}

// AGENTS.md is the pointer an agent in a consumer app finds: at the root of the sources
// jar, and as the module overview page of the API docs, which Dokka wants under a
// `# Module <name>` heading.
def agentNotes = rootProject.file('AGENTS.md')
def agentModuleDoc = tasks.register('agentModuleDoc') {
	def output = layout.buildDirectory.file('generated/dokka/module.md')
	inputs.file(agentNotes)
	outputs.file(output)
	doLast {
		output.get().asFile.with {
			parentFile.mkdirs()
			text = "# Module ${artifactName}\n\n" + agentNotes.text.replaceFirst(/^# [^\n]*\n/, '')
		}
	}
}
dokka {
	dokkaSourceSets.configureEach { includes.from(agentModuleDoc) }
}
tasks.matching { it.name in ['sourcesJar', 'sourceReleaseJar'] }.configureEach {
	from(agentNotes)
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
tasks.withType(Jar).configureEach {
	from(rootProject.file('../../LICENSE')) { into "META-INF/licenses/com.inth/${artifactName}"; rename { 'LICENSE' } }
	from(rootProject.file('../../NOTICE')) { into "META-INF/licenses/com.inth/${artifactName}" }
	manifest.attributes('Implementation-Version': nativeVersion, 'Implementation-Vendor': 'Inth')
}

def metadata = tasks.register('generateNativeMetadata') {
	def output = layout.buildDirectory.file("generated/native-metadata/META-INF/inth/${artifactName}.properties")
	inputs.property('nativeVersion', nativeVersion)
	inputs.property('artifact', artifactName)
	outputs.file(output)
	doLast {
		output.get().asFile.with {
			parentFile.mkdirs()
			text = "group=com.inth\nartifact=${artifactName}\nversion=${nativeVersion}\nprotocol=1\n"
		}
	}
}

if (project.name == 'inth-core') {
	sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/native-metadata'))
	tasks.named('processResources') { dependsOn metadata }
	tasks.named('sourcesJar') { dependsOn metadata }
} else {
	android.sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/native-metadata').get().asFile)
	android.sourceSets.main.resources.srcDir(layout.buildDirectory.dir('license-resources').get().asFile)
	def license = tasks.register('copyNativeLicense', Copy) {
		from(rootProject.file('../../LICENSE')) { rename { 'LICENSE' } }
		from(rootProject.file('../../NOTICE'))
		into layout.buildDirectory.dir("license-resources/META-INF/licenses/com.inth/${artifactName}")
	}
	tasks.named('preBuild') { dependsOn metadata, license }
}

afterEvaluate {
	publishing.publications {
		register('release', MavenPublication) {
			from components.getByName(project.name == 'inth-core' ? 'java' : 'release')
			artifact apiDocs
			pom {
				name = project.name
				description = project.name == 'inth-core' ?
					'Headless Inth consent and IAB engine for the JVM.' :
					(project.name == 'inth-consent-ui' ? 'Optional native Compose consent presenter for Inth.' : 'Android persistence, transport and lifecycle services for Inth. No UI dependency.')
				url = 'https://inth.com'
				licenses {
					license {
						name = 'Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
						distribution = 'repo'
					}
				}
				developers { developer { id = 'inth'; name = 'Inth'; url = 'https://inth.com' } }
				scm {
					url = 'https://github.com/inthhq/inth'
					connection = 'scm:git:https://github.com/inthhq/inth.git'
					if (centralPublication) {
						developerConnection = 'scm:git:ssh://git@github.com/inthhq/inth.git'
					}
				}
			}
		}
	}
	if (centralPublication || privatePublication) {
		def signingKey = providers.environmentVariable('INTH_MAVEN_SIGNING_KEY').orNull
		def signingPassword = providers.environmentVariable('INTH_MAVEN_SIGNING_PASSWORD').orNull
		if (!signingKey || !signingPassword) {
			throw new GradleException('Signed Maven publication requires an in-memory signing key/password from the secure release environment.')
		}
		if (privatePublication && (!System.getenv('INTH_MAVEN_USERNAME') || !System.getenv('INTH_MAVEN_TOKEN'))) {
			throw new GradleException('Private Maven publication requires repository credentials from the secure release environment.')
		}
		signing {
			useInMemoryPgpKeys(signingKey, signingPassword)
			sign publishing.publications
		}
	}
}

tasks.withType(PublishToMavenRepository).configureEach {
	dependsOn rootProject.tasks.named('verifyNativeVersion')
}
