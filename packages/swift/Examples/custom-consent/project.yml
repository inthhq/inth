name: InthCustomConsent
options:
  deploymentTarget:
    iOS: '16.4'
packages:
  InthNative:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
targets:
  InthCustomConsent:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The local /init responses the app serves itself. No backend is contacted.
      - path: ../../../../examples/native/consent-demo/fixtures
        buildPhase: resources
    dependencies:
      - package: InthNative
        product: InthCore
      - package: InthNative
        product: InthApple
      - package: InthNative
        product: InthConsentUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.examples.customconsent
        INFOPLIST_KEY_CFBundleDisplayName: Custom consent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  InthCustomConsent:
    build:
      targets:
        InthCustomConsent: all
