name: InthSwiftUI
options:
  deploymentTarget:
    iOS: '16.4'
packages:
  InthNative:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
targets:
  InthSwiftUI:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: InthNative
        product: InthCore
      - package: InthNative
        product: InthApple
      - package: InthNative
        product: InthConsentUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.examples.swiftui
        INFOPLIST_KEY_CFBundleDisplayName: SwiftUI consent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_InthBackendURL: $(C15T_BACKEND_URL)
        INFOPLIST_KEY_InthPrivacyPolicyURL: $(C15T_PRIVACY_POLICY_URL)
  InthSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: InthSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.examples.swiftui.tests
  InthSwiftUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InthSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.examples.swiftui.uitests
schemes:
  InthSwiftUI:
    build:
      targets:
        InthSwiftUI: all
        InthSwiftUITests: [test]
        InthSwiftUIUITests: [test]
    test:
      targets: [InthSwiftUITests, InthSwiftUIUITests]
      parallelizable: false
