buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Reads android/app/google-services.json, a placeholder Firebase project.
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Versioned native artifacts are resolved by the host, without a composite source build.
// #region docs:bare-android-repository title="android/build.gradle"
allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(System.getenv('C15T_MAVEN_URL') ?: 'https://maven.pkg.github.com/inthhq/c15t-private')
                    if (url.scheme == 'https') {
                        credentials {
                            username = System.getenv('C15T_MAVEN_USERNAME')
                            password = System.getenv('C15T_MAVEN_TOKEN')
                        }
                    }
                }
            }
            filter { includeGroup('com.inth') }
        }
    }
}
// #endregion docs:bare-android-repository
