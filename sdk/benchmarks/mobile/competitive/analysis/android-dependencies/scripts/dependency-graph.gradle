import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

gradle.projectsEvaluated {
    // Init scripts also run in the React Native and Expo included plugin builds.
    def app = rootProject.findProject(':app')
    if (app == null) {
        return
    }
    app.tasks.register('cmpDependencyGraph') {
        doLast {
            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def result = configuration.incoming.resolutionResult
            def components = result.allComponents.collect { component ->
                [id: component.id.displayName,
                 selectionReasons: component.selectionReason.descriptions.collect { it.description },
                 dependencies: component.dependencies.collect { dependency ->
                     if (dependency instanceof ResolvedDependencyResult) {
                         return [requested: dependency.requested.displayName,
                                 selected: dependency.selected.id.displayName,
                                 constraint: dependency.constraint]
                     }
                     throw new GradleException("Unresolved dependency: ${dependency.requested}")
                 }.sort { a, b -> a.requested <=> b.requested }]
            }.sort { a, b -> a.id <=> b.id }
            def target = new File(System.getenv('CMP_GRAPH_OUT'))
            def artifacts = configuration.incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts.collect { artifact ->
                [coordinate: artifact.id.componentIdentifier.toString(),
                 sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }.sort { a, b -> a.coordinate <=> b.coordinate ?: a.sha256 <=> b.sha256 }
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: 'releaseRuntimeClasspath',
                gradleVersion: gradle.gradleVersion,
                root: result.rootComponent.get().id.displayName,
                components: components,
                artifacts: artifacts,
            ])) + '\n'
        }
    }
}
