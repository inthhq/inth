name: Release native mobile SDKs

on:
  push:
    branches: ['main', 'canary']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Recover the current native lock from this exact version-PR commit SHA
        type: string
        default: ''
      previous_run_id:
        description: Resume the Maven deployment state saved by this previous run
        type: string
        default: ''
      new_maven_upload_version:
        description: Confirm this exact Android version has no existing Central deployment before a new upload
        type: string
        default: ''
      discard_failed_maven_version:
        description: Discard saved state only after Central confirms this version's deployment FAILED
        type: string
        default: ''

permissions: {}

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE_POLICY: ${{ vars.TURBO_CACHE_POLICY }}

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'c15t/c15t'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      skip_performance: true
      release_affected: ${{ github.ref == 'refs/heads/canary' }}
      skip_mobile_device: true

  release:
    needs: checks
    if: github.repository == 'c15t/c15t' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.checks.result == 'success'
    runs-on: macos-15
    environment: mobile-release
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      C15T_NATIVE_PUBLISH: ${{ vars.C15T_NATIVE_PUBLISH }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          cache-scope: mobile-publish
      - name: Prepare native publishing tools
        run: |
          echo "C15T_NATIVE_STATE_DIR=$RUNNER_TEMP/mobile-release-state" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          swift --version
          gpg --version
      - name: Restore Central retry state
        id: restore_state
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PREVIOUS_RUN_ID" ]; then
            PREVIOUS_RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mobile-release-state&per_page=100" \
              | jq -r --arg branch "$GITHUB_REF_NAME" --argjson repository "$GITHUB_REPOSITORY_ID" '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch and .workflow_run.head_repository_id == $repository)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          fi
          if [ -z "$PREVIOUS_RUN_ID" ]; then exit 0; fi
          [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID" \
            | jq -e --arg repository "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
              '.path == ".github/workflows/release-mobile.yml" and .head_repository.full_name == $repository and .head_branch == $branch and (.event == "push" or .event == "workflow_dispatch")'
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name mobile-release-state --dir "$C15T_NATIVE_STATE_DIR"
      - name: Discard a failed Central deployment state
        if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.discard_failed_maven_version != ''
        env:
          FAILED_MAVEN_VERSION: ${{ inputs.discard_failed_maven_version }}
          C15T_CENTRAL_USERNAME: ${{ secrets.C15T_CENTRAL_USERNAME }}
          C15T_CENTRAL_TOKEN: ${{ secrets.C15T_CENTRAL_TOKEN }}
        run: |
          bun scripts/publish-maven.ts discard-failed \
            --version "$FAILED_MAVEN_VERSION" \
            --state-file "$C15T_NATIVE_STATE_DIR/maven-$FAILED_MAVEN_VERSION.json"
      - name: Version or publish native packages
        env:
          C15T_MAVEN_NEW_UPLOAD_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && (inputs.new_maven_upload_version || inputs.discard_failed_maven_version) || '' }}
          NATIVE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C15T_CENTRAL_USERNAME: ${{ secrets.C15T_CENTRAL_USERNAME }}
          C15T_CENTRAL_TOKEN: ${{ secrets.C15T_CENTRAL_TOKEN }}
          C15T_MAVEN_SIGNING_KEY: ${{ secrets.C15T_MAVEN_SIGNING_KEY }}
          C15T_MAVEN_SIGNING_PASSWORD: ${{ secrets.C15T_MAVEN_SIGNING_PASSWORD }}
        run: |
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          unset authorization
          if [ -n "$NATIVE_SOURCE_COMMIT" ]; then
            bun scripts/recover-mobile-release.ts "$NATIVE_SOURCE_COMMIT"
            exit 0
          fi
          tip=$(git ls-remote --exit-code "$REPOSITORY_URL" "$GITHUB_REF" | cut -f1)
          if [ -z "$tip" ]; then exit 1; fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            if [ -f .tegami/mobile/publish-lock.yaml ]; then
              echo 'Finish the existing release at its locked source commit.'
              bun run tegami:mobile publish
            fi
            exit 0
          fi
          bun run tegami:mobile ci
      - name: Remove completed Central retry files
        if: always() && steps.restore_state.outcome == 'success'
        run: |
          mkdir -p "$C15T_NATIVE_STATE_DIR"
          printf '%s\n' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" > "$C15T_NATIVE_STATE_DIR/snapshot.txt"
          bun scripts/publish-mobile.ts prune-state
      - name: Retain Central retry state and the exact signed bundle
        if: always() && steps.restore_state.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-release-state
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/mobile-release-state/maven-*.json
            ${{ runner.temp }}/mobile-release-state/maven-*.zip
            ${{ runner.temp }}/mobile-release-state/snapshot.txt
