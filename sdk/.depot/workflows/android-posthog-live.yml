# Manual check that the Android consent demo sends PostHog events to a real
# project only while measurement is granted. Every other Android suite points
# the vendor SDKs at a local capture server; this one cannot count traffic
# itself, so it uploads a run id for the PostHog query described in
# native/examples/consent-demo/README.md.
#
# Manual dispatch only, on canary. The Depot CI secret POSTHOG_E2E_PROJECT_KEY
# applies only to this repository, the canary branch and this workflow file,
# and Depot CI does not run pull requests from forks. Do not add pull_request,
# push or schedule triggers.
name: Android live PostHog consent

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-posthog-live-${{ github.run_id }}
  cancel-in-progress: false

env:
  C15T_ANDROID_IMAGE: system-images;android-36;google_apis;x86_64
  C15T_ANDROID_ARCH: x86_64
  # The "events-sdk e2e" project (305107) is on PostHog EU Cloud.
  POSTHOG_E2E_HOST: https://eu.i.posthog.com

jobs:
  posthog-live:
    name: Consent demo against live PostHog
    # Belt and braces for the trigger list above: never run for a pull request
    # event. `depot ci run` from a working tree reports its own event name, so
    # this cannot require workflow_dispatch.
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Choose the run id
        id: run
        env:
          POSTHOG_E2E_PROJECT_KEY: ${{ secrets.POSTHOG_E2E_PROJECT_KEY }}
        run: |
          # Fail before the emulator boots when the secret did not resolve.
          if [[ -z "${POSTHOG_E2E_PROJECT_KEY}" ]]; then
            echo "::error::POSTHOG_E2E_PROJECT_KEY is not available to this run"
            exit 1
          fi
          run_id="c15t-android-$(date -u +%Y%m%dT%H%M%SZ)-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "PostHog run_id: ${run_id} (event: ${GITHUB_EVENT_NAME})"
      - name: Prepare the Android toolchain
        run: bash .depot/android-toolchain.sh
      - name: Boot the emulator
        id: boot
        run: bash scripts/ci-android-emulator.sh start
      - name: Live PostHog journey
        env:
          POSTHOG_E2E_PROJECT_KEY: ${{ secrets.POSTHOG_E2E_PROJECT_KEY }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          # Keep the whole run in logcat for the evidence step.
          adb logcat -G 8M
          adb logcat -c
          sh native/core-android/gradlew -p native/core-android --no-build-cache :consent-demo:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.c15t.demo.RealVendorSdkTest#posthogLiveFollowsConsent \
            "-Pandroid.testInstrumentationRunnerArguments.c15tPostHogLiveHost=${POSTHOG_E2E_HOST}" \
            "-Pandroid.testInstrumentationRunnerArguments.c15tPostHogLiveKey=${POSTHOG_E2E_PROJECT_KEY}" \
            "-Pandroid.testInstrumentationRunnerArguments.c15tPostHogLiveRunId=${RUN_ID}"
      - name: Collect the evidence
        if: ${{ always() && steps.boot.outcome != 'skipped' }}
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          out="${RUNNER_TEMP}/posthog-live"
          mkdir -p "${out}"
          adb logcat -d -s c15t-vendor-evidence:I > "${out}/evidence.log" || true
          grep -o 'posthog-live evidence .*' "${out}/evidence.log" | sed 's/^posthog-live evidence //' | tail -1 > "${out}/evidence.json" || true
          {
            echo "## Live PostHog consent check"
            echo
            echo "- run_id: \`${RUN_ID}\`"
            echo "- host: ${POSTHOG_E2E_HOST} (project 305107)"
            echo
            echo "Expected: one \`c15t_probe\` event with \`step=granted\`, and none with \`fresh\`, \`rejected\`, \`withdrawn\` or \`relaunched\`."
            echo "Check it with the query in native/examples/consent-demo/README.md."
            echo
            echo '```'
            grep 'posthog-live' "${out}/evidence.log" | sed 's/^.*c15t-vendor-evidence: //' || echo "no evidence logged"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop the emulator
        if: ${{ always() && steps.boot.outcome != 'skipped' }}
        run: bash scripts/ci-android-emulator.sh stop
      - name: Upload the evidence and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-posthog-live-${{ steps.run.outputs.id }}
          path: |
            ${{ runner.temp }}/posthog-live/**
            native/examples/consent-demo/android/build/reports/androidTests/**
            native/examples/consent-demo/android/build/outputs/androidTest-results/**
            ${{ runner.temp }}/android-emulator/*.log
          if-no-files-found: warn
          retention-days: 30
