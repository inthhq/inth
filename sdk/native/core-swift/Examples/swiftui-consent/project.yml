name: C15tSwiftUI
options:
  deploymentTarget:
    iOS: '16.4'
packages:
  C15tNative:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
targets:
  C15tSwiftUI:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: C15tNative
        product: C15tCore
      - package: C15tNative
        product: C15tApple
      - package: C15tNative
        product: C15tConsentUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c15t.examples.swiftui
        INFOPLIST_KEY_CFBundleDisplayName: SwiftUI consent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_C15tBackendURL: $(C15T_BACKEND_URL)
        INFOPLIST_KEY_C15tPrivacyPolicyURL: $(C15T_PRIVACY_POLICY_URL)
  C15tSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: C15tSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c15t.examples.swiftui.tests
  C15tSwiftUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: C15tSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c15t.examples.swiftui.uitests
schemes:
  C15tSwiftUI:
    build:
      targets:
        C15tSwiftUI: all
        C15tSwiftUITests: [test]
        C15tSwiftUIUITests: [test]
    test:
      targets: [C15tSwiftUITests, C15tSwiftUIUITests]
      parallelizable: false
