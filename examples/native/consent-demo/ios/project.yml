name: InthConsentDemo
options:
  deploymentTarget:
    iOS: '16.4'
packages:
  InthNative:
    path: ../../../../packages/swift
  # Real vendor SDKs for the vendor journey (run-vendor-e2e.sh). The demo app links
  # them; the Inth Swift packages never do. They stay idle unless a Debug launch
  # passes INTH_VENDOR_BASE. Pinned exactly so a vendor release cannot change the proof.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.93.1
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift
    exactVersion: 7.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.32.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
    IPHONEOS_DEPLOYMENT_TARGET: '16.4'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
    INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
targets:
  InthConsentDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: VendorSDKs
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - package: InthNative
        product: InthConsentUI
      - package: InthNative
        product: InthApple
      - package: PostHog
        product: PostHog
      - package: Mixpanel
        product: Mixpanel
      - package: Sentry
        product: Sentry
      - package: Firebase
        product: FirebaseAnalytics
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Firebase starts with collection and every consent type denied, so nothing is
        # measured before the Inth binding applies the saved decision.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        FirebaseAppDelegateProxyEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.prototype.consent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Consent demo
        INFOPLIST_KEY_InthBackendURL: $(INTH_PROJECT_URL)
        INFOPLIST_KEY_InthPrivacyPolicyURL: $(INTH_PRIVACY_POLICY_URL)
  InthUIKitDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [consent-demo-entry.swift]
      - path: UIKit
      - path: Assets.xcassets
      - path: VendorSDKs
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - package: InthNative
        product: InthConsentUI
      - package: InthNative
        product: InthApple
      - package: PostHog
        product: PostHog
      - package: Mixpanel
        product: Mixpanel
      - package: Sentry
        product: Sentry
      - package: Firebase
        product: FirebaseAnalytics
    info:
      path: Generated/UIKit-Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Consent demo
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ConsentDemoSceneDelegate
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Firebase starts with collection and every consent type denied, so nothing is
        # measured before the Inth binding applies the saved decision.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        FirebaseAppDelegateProxyEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.prototype.consent.uikit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Consent UIKit demo
        INFOPLIST_KEY_InthBackendURL: $(INTH_PROJECT_URL)
        INFOPLIST_KEY_InthPrivacyPolicyURL: $(INTH_PRIVACY_POLICY_URL)
  InthUIKitDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InthUIKitDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.prototype.consent.uikit.uitests
        GENERATE_INFOPLIST_FILE: YES
  InthConsentDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InthConsentDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inth.prototype.consent.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InthConsentDemo:
    build:
      targets:
        InthConsentDemo: all
        InthConsentDemoUITests: [test]
    test:
      targets: [InthConsentDemoUITests]
  InthUIKitDemo:
    build:
      targets:
        InthUIKitDemo: all
        InthUIKitDemoUITests: [test]
    test:
      targets: [InthUIKitDemoUITests]
