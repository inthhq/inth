name: Set up the SDK workspace
description: Install Node, pnpm, the bun runtime the SDK scripts use, the workspace and optionally Chromium.
inputs:
  browsers:
    description: Install Chromium and its system libraries for each resolved Playwright version.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        cache: true
    # Many SDK scripts still run TypeScript with bun as the runtime. pnpm
    # installs the workspace; bun only executes scripts.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.11
    - shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
    - id: playwright-key
      if: inputs.browsers == 'true'
      shell: bash
      run: |
        versions="$(bun -e 'import { browserInstallations } from "./scripts/install-browsers.ts"; console.log([...browserInstallations(".").keys()].sort().join("-"));')"
        echo "versions=${versions}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: inputs.browsers == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-key.outputs.versions }}
        restore-keys: |
          playwright-${{ runner.os }}-
    # Install system libraries even when the browser archive came from cache.
    - shell: bash
      if: inputs.browsers == 'true'
      run: bun scripts/install-browsers.ts --with-deps
