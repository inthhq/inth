# --- State ---

- name: needs-repro
  color: "fbca04"
  description: Waiting on a minimal reproduction

- name: needs-info
  color: "fbca04"
  description: Waiting on versions, environment or clarification

- name: needs-approval
  color: "e4e669"
  description: A maintainer approves the feature or refactor before work starts

- name: blocked
  color: "b60205"
  description: Blocked by other work or an upstream dependency

- name: help wanted
  color: "008672"
  description: Community contributions welcome

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: invalid
  color: "e4e669"
  description: This doesn't seem right

- name: question
  color: "d876e3"
  description: Further information is requested

- name: upstream
  color: "e99695"
  description: Belongs to a dependency or external tool

# --- Automation ---

- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency
