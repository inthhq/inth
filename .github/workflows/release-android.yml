name: Release Android

# DISABLED. This release line turns on after its packages are renamed from
# c15t to Inth and the owner adds registry credentials. Until then it runs
# only by hand, and tools/ci/release-guard.ts stops the publish job: it
# refuses while the ANDROID_RELEASE_ENABLED repository variable is not "true",
# and it refuses any c15t, @c15t/* or com.c15t artifact even when the variable
# is set. The publish step is a placeholder that fails; nothing here can
# publish.
#
# Releases: Maven Central, packages/android. Tags: android@<version>. To
# enable: wire the publish step, grant it the permissions it needs, put the
# credentials in a protected environment and set ANDROID_RELEASE_ENABLED to
# "true".
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'inthhq/inth' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      products: android
    permissions:
      contents: read

  publish:
    name: Publish Android
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Refuse while disabled or while artifacts carry c15t names
        env:
          RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
        run: node tools/ci/release-guard.ts android
      - name: Publish
        run: |
          echo "::error::Android publishing is not wired yet. See the comment at the top of this workflow."
          exit 1
