name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.repository == 'inthhq/inth' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  sign-macos:
    name: Sign and notarize macOS package
    needs: verify
    if: github.repository == 'inthhq/inth' && github.ref == 'refs/heads/main'
    # Signing secrets live in this environment, which only main can use.
    # The job runs system tools only: no pnpm install and no third-party actions.
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packages/cli/scripts/sign-macos-release.sh
          sparse-checkout-cone-mode: false
      - name: Download unsigned macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-macOS-ARM64
          path: unsigned
      - name: Sign and notarize
        run: sh packages/cli/scripts/sign-macos-release.sh unsigned/inth-cli-darwin-arm64-*.tgz signed
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SIGNING_IDENTITY: "Developer ID Application: Consent Management Inc (738K38NVK6)"
          TEAM_ID: 738K38NVK6
      - name: Upload signed macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inth-macOS-ARM64
          path: signed/*.tgz
          if-no-files-found: error

  test-signed-macos:
    name: Test signed macOS package
    needs: sign-macos
    # Runs the signed binary here, away from the signing secrets.
    runs-on: macos-15
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download signed macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inth-macOS-ARM64
          path: signed
      - name: Run the signed binary
        run: |
          mkdir package-test
          tar -xzf signed/inth-cli-darwin-arm64-*.tgz -C package-test
          binary=package-test/package/bin/inth
          codesign --verify --strict --verbose=2 "$binary"
          expected=$(plutil -extract version raw -o - package-test/package/package.json)
          test "$("$binary" --version)" = "$expected"
          env PATH= "$binary" --help >/dev/null

  release:
    needs: [verify, sign-macos, test-signed-macos]
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Download verified native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: inth-*
          merge-multiple: true
          path: packages/cli/artifacts
      - name: Generate package documentation
        run: pnpm docs:bundle
      - name: Version or publish packages
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
