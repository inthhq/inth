name: GitHub Actions security

# zizmor audits the workflows and actions for injection, credential and
# permission problems. It runs when they change.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".depot/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".depot/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          advanced-security: false
          annotations: true
          persona: auditor
          min-severity: high
          min-confidence: medium
