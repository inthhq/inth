name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:lint --format github
      - run: pnpm docs:bundle
      - run: node packages/cli/scripts/verify-docs.ts

  check:
    name: Lint, types, and unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:unit

  native:
    name: Native CLI on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: blacksmith-6vcpu-macos-15
          - platform: Linux x64
            runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-linux-gnu.2.36
          - platform: Linux arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-linux-gnu.2.36
          - platform: Windows x64
            runner: blacksmith-4vcpu-windows-2025
            target: x86_64-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Pin the Linux ABI instead of inheriting the runner's newer glibc.
      SCRIPTC_CC: ${{ matrix.target && 'zigcc' || '' }}
      SCRIPTC_TARGET: ${{ matrix.target || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install Linux and Windows toolchain
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang cmake zlib1g-dev libsecret-1-0 gnome-keyring dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Native and package tests on Linux
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c 'printf "test-only\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; pnpm --filter @inth/cli test && pnpm --filter @inth/cli test:package'
      - name: Native and package tests on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm --filter @inth/cli test && pnpm --filter @inth/cli test:package
      - name: Test Linux package on the oldest supported glibc
        if: runner.os == 'Linux'
        run: sh packages/cli/scripts/test-linux-baseline.sh packages/cli/artifacts/inth-cli-linux-*.tgz packages/cli/build/native-linux-*
      - name: Upload native npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inth-${{ runner.os }}-${{ runner.arch }}
          path: packages/cli/artifacts/*.tgz
          if-no-files-found: error
