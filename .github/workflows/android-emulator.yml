# Android suites that need a booted emulator, which needs KVM. Depot turned off
# nested virtualization on its Linux runners in November 2026 (CVE-2026-99312),
# so only the steps that boot an emulator run on GitHub-hosted ubuntu-24.04,
# which has KVM. The RN and Expo apps build on Depot runners and hand their APKs
# to the emulator jobs, which only boot, install and run the journey.
name: Android emulator

on:
  pull_request:
    paths:
      - "packages/react-native/**"
      - "packages/sdk/core/**"
      - "packages/android/**"
      - "packages/native-protocol/**"
      - "examples/native/**"
      - "internals/fixtures/react-native-bare/**"
      - "internals/fixtures/expo-dev/**"
      - "scripts/mobile-compatibility.json"
      # The RN journey exports its policy with these scripts and packages.
      - "scripts/export-mobile-e2e-policy.ts"
      - "scripts/export-mobile-policy.ts"
      - "packages/sdk/iab/**"
      - "packages/sdk/schema/**"
      - "packages/sdk/translations/**"
      - "scripts/ci-android-emulator.sh"
      - "scripts/ci-android-toolchain.sh"
      - "scripts/ci-report-failure.sh"
      - "scripts/vendor_capture.py"
      - ".github/workflows/android-emulator.yml"
      - ".github/actions/setup-sdk/**"
      - "pnpm-lock.yaml"
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its run. Every other run gets
# its own group, so parallel manual runs never cancel each other.
concurrency:
  group: android-emulator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INTH_ANDROID_IMAGE: system-images;android-36;google_apis;x86_64
  INTH_ANDROID_ARCH: x86_64

jobs:
  native:
    name: Native instrumented suites (kernel and consent demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Also pins the emulator: a new emulator release arrives only when the key changes.
      - name: Restore the emulator and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: android-emulator-android-36-google_apis-x86_64-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh emulator
      - name: Restore Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-native-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/**', 'examples/native/consent-demo/android/**/*.gradle.kts') }}
          restore-keys: gradle-deps-native-
      - name: Boot the emulator
        id: boot
        run: bash scripts/ci-android-emulator.sh start
      - name: Android kernel instrumented suite
        run: sh packages/android/gradlew -p packages/android --no-build-cache :inth-android:connectedDebugAndroidTest
      # RealVendorSdkTest points PostHog, Mixpanel and Sentry at this server.
      # The app reaches it as localhost through adb reverse, and Mixpanel, which
      # refuses loopback hosts, as 10.0.2.2, the emulator's alias for this machine.
      - name: Start the vendor capture server
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          out="${RUNNER_TEMP}/vendor-capture"
          mkdir -p "${out}"
          nohup python3 scripts/vendor_capture.py --port 39874 --out "${out}" > "${out}/server.log" 2>&1 &
          for _ in $(seq 1 50); do [[ -f "${out}/vendor-capture-ready" ]] && break; sleep 0.2; done
          curl -fsS http://localhost:39874/health
          adb reverse tcp:39874 tcp:39874
      - name: Consent demo journeys
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: sh packages/android/gradlew -p packages/android --no-build-cache :consent-demo:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.inthVendorCapture=http://localhost:39874
      - name: Stop the emulator
        if: always()
        run: bash scripts/ci-android-emulator.sh stop
      - name: Upload test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-instrumented
          path: |
            packages/android/inth-android/build/reports/androidTests/**
            packages/android/inth-android/build/outputs/androidTest-results/**
            examples/native/consent-demo/android/build/reports/androidTests/**
            examples/native/consent-demo/android/build/outputs/androidTest-results/**
            ${{ runner.temp }}/android-emulator/*.log
            ${{ runner.temp }}/vendor-capture/vendor-requests.json
            ${{ runner.temp }}/vendor-capture/server.log
          if-no-files-found: warn
          retention-days: 7

  # Device screenshots of the stock screens and of the app-owned example built on the headless
  # blocks, for pull request descriptions. Dispatch it with
  # `gh workflow run android-emulator.yml --ref <branch>`.
  screenshots:
    name: Stock and custom consent screenshots
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore the emulator and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: android-emulator-android-36-google_apis-x86_64-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh emulator
      - name: Boot the emulator
        run: bash scripts/ci-android-emulator.sh start
      - name: Capture every screen in light and dark
        run: sh packages/android/gradlew -p packages/android --no-build-cache :consent-demo:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.inth.demo.ConsentScreenshotTest
      - name: Pull the screenshots
        run: |
          adb pull /sdcard/Download/inth-consent-screenshots "${RUNNER_TEMP}/consent-screenshots"
          test "$(find "${RUNNER_TEMP}/consent-screenshots" -name '*.png' | wc -l)" -eq 12
      - name: Stop the emulator
        if: always()
        run: bash scripts/ci-android-emulator.sh stop
      - name: Upload the screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consent-screenshots-android
          path: ${{ runner.temp }}/consent-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  # Builds need no KVM, so they run on Depot, whose runners also share Gradle task
  # outputs between runs through Depot Cache. Pull requests from forks get no
  # Depot runner and build on GitHub instead.
  react-native-build:
    name: Build the release RN app for the emulator
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 45
    env:
      INTH_APP_E2E_PHASE: build
      INTH_APP_E2E_OUT: ${{ github.workspace }}/.ci-reports/rn-android-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore the NDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: android-ndk-27.1.12297006-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh build
      - uses: ./.github/actions/setup-sdk
      - name: Restore Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-rn-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/**', 'packages/react-native/android/**/*.gradle*', 'internals/fixtures/react-native-bare/android/**/*.gradle', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-rn-
      - name: Build the app and its UIAutomator runner
        run: bash internals/fixtures/react-native-bare/scripts/app-e2e.sh android
      - name: Upload the APKs and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rn-android-build
          path: .ci-reports/rn-android-build/
          if-no-files-found: error
          retention-days: 3

  react-native:
    name: Release RN app on Android Emulator, UIAutomator
    needs: react-native-build
    if: ${{ !cancelled() && needs.react-native-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INTH_APP_E2E_PHASE: run
      INTH_APP_E2E_BUILD: ${{ github.workspace }}/.ci-reports/rn-android-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rn-android-build
          path: .ci-reports/rn-android-build
      - name: Restore the emulator and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: android-emulator-android-36-google_apis-x86_64-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh emulator
      # The journeys join their screen recording into journey.mp4 with ffmpeg.
      - name: Install ffmpeg if the image lacks it
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - name: Run real consent controls and record the app
        run: bash internals/fixtures/react-native-bare/scripts/app-e2e.sh android
      - name: Upload recordings, native snapshots, JUnit results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-app-e2e-android
          path: internals/fixtures/react-native-bare/.artifacts/app-e2e/**
          if-no-files-found: error
          retention-days: 7

  expo-build:
    name: Build Expo ${{ matrix.cell }} for the emulator
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-8' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The fixture's own Expo 58 build, and as packed consumers the oldest Expo
        # cell of scripts/mobile-compatibility.json and the newest one below the
        # fixture's SDK. Expo 56 gets the packed type, Codegen and prebuild checks.
        cell: [fixture, expo-55, expo-57]
    env:
      INTH_APP_E2E_PHASE: build
      INTH_EXPO_CELL: ${{ matrix.cell != 'fixture' && matrix.cell || '' }}
      INTH_APP_E2E_OUT: ${{ github.workspace }}/.ci-reports/expo-build/${{ matrix.cell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore the NDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: android-ndk-27.1.12297006-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh build
      - uses: ./.github/actions/setup-sdk
      - name: Restore Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-expo-${{ matrix.cell }}-${{ hashFiles('packages/android/**/*.gradle.kts', 'packages/android/gradle/**', 'packages/react-native/android/**/*.gradle*', 'internals/fixtures/expo-dev/package.json', 'scripts/mobile-compatibility.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-expo-${{ matrix.cell }}-
      - name: Build the app with the real vendor SDKs
        run: bash internals/fixtures/expo-dev/scripts/vendor-e2e.sh android
      - name: Upload the APK and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expo-${{ matrix.cell }}-android-build
          path: .ci-reports/expo-build/${{ matrix.cell }}/
          if-no-files-found: error
          retention-days: 3

  expo-vendor-sdks:
    name: Expo ${{ matrix.cell }} with real vendor SDKs on Android Emulator
    needs: expo-build
    # One cell's failed build must not skip the others. A failed cell has no APK,
    # and its job stops at the first step.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: [fixture, expo-55, expo-57]
    env:
      INTH_APP_E2E_PHASE: run
      INTH_EXPO_CELL: ${{ matrix.cell != 'fixture' && matrix.cell || '' }}
      INTH_APP_E2E_BUILD: ${{ github.workspace }}/.ci-reports/expo-build/${{ matrix.cell }}
      INTH_APP_E2E_OUT: ${{ github.workspace }}/.ci-reports/expo-vendor-e2e/${{ matrix.cell }}-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: expo-${{ matrix.cell }}-android-build
          path: .ci-reports/expo-build/${{ matrix.cell }}
      - name: Check the build produced an APK
        run: test -s ".ci-reports/expo-build/${{ matrix.cell }}/apk/app-release.apk"
      - name: Restore the emulator and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: android-emulator-android-36-google_apis-x86_64-v1
      - name: Prepare the Android toolchain
        run: bash scripts/ci-android-toolchain.sh emulator
      # The journeys join their screen recording into journey.mp4 with ffmpeg.
      - name: Install ffmpeg if the image lacks it
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - name: Run PostHog, Mixpanel, Amplitude, Sentry Replay and Firebase through the consent journey
        run: bash internals/fixtures/expo-dev/scripts/vendor-e2e.sh android
      - name: Upload vendor requests, Firebase log evidence and UIAutomator frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-app-e2e-expo-${{ matrix.cell }}-android
          path: .ci-reports/expo-vendor-e2e/${{ matrix.cell }}-android/**
          if-no-files-found: error
          retention-days: 7

  # Nobody watches a nightly. Open an issue, or comment on the open one, when a
  # main-branch or scheduled run fails.
  report-failure:
    name: Report a failed main or nightly run
    needs: [native, react-native-build, react-native, expo-build, expo-vendor-sdks]
    if: ${{ failure() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          INTH_FAILURE_TITLE: Android emulator suites are failing on main
        run: bash scripts/ci-report-failure.sh
