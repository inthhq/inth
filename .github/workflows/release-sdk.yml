name: Release SDK

# Publishes the public @inth packages in packages/sdk to npm with npm trusted
# publishing, then tags sdk@<version>, never a bare version: SwiftPM reads
# those as Swift releases. The runbook is .tegami/sdk/README.md.
#
# tools/ci/release-guard.ts stops the publish job, before it installs
# anything, until the SDK_RELEASE_ENABLED repository variable is "true".
#
# Keep this file name: npm trusted publishing for the SDK packages names
# release-sdk.yml, so a rename makes npm reject the publish.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'inthhq/inth' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      products: sdk
    permissions:
      contents: read

  publish:
    name: Publish SDK
    needs: verify
    # npm trusted publishing requires a GitHub-hosted runner. Each package's
    # trusted publisher names this environment, which only main can use.
    environment: npm-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # The sdk@<version> tag, the GitHub release and the version PR.
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for a publish credential.
      id-token: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Refuse while disabled or while artifacts carry c15t names
        env:
          RELEASE_ENABLED: ${{ vars.SDK_RELEASE_ENABLED }}
        run: node tools/ci/release-guard.ts sdk
      - uses: ./.github/actions/setup-sdk
      - name: Build the SDK packages and their docs
        run: pnpm turbo run build build:docs --concurrency=4 --filter='./packages/sdk/*'
      - name: Pack and check every package
        run: pnpm sdk:pack
      - name: Finish a pending release, or version or publish packages
        run: pnpm tegami:sdk release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
