name: Release SDK

# DISABLED. Its packages carry Inth names; this release line turns on once
# the owner adds registry credentials. Until then it runs
# only by hand, and tools/ci/release-guard.ts stops the publish job: it
# refuses while the SDK_RELEASE_ENABLED repository variable is not "true", and
# it refuses any inth, @inth/* or com.inth artifact even when the variable is
# set. The publish step is a placeholder that fails; nothing here can publish.
#
# Releases: npm, @inth/sdk and the framework packages in packages/sdk. Tags:
# sdk@<version>, never a bare version, which SwiftPM reads as a Swift release.
# To enable: wire the publish step, grant it the permissions it needs, put the
# credentials in a protected environment and set SDK_RELEASE_ENABLED to
# "true".
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'inthhq/inth' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      products: sdk
    permissions:
      contents: read

  publish:
    name: Publish SDK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Refuse while disabled or while artifacts carry inth names
        env:
          RELEASE_ENABLED: ${{ vars.SDK_RELEASE_ENABLED }}
        run: node tools/ci/release-guard.ts sdk
      - name: Publish
        run: |
          echo "::error::SDK publishing is not wired yet. See the comment at the top of this workflow."
          exit 1
