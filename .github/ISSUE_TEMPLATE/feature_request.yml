name: Feature request
description: Suggest a feature for the Inth CLI or SDK
labels: ["feature"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Inth CLI
        - Web SDK (c15t packages)
        - React Native SDK
        - Swift SDK
        - Android SDK
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, prior art, use cases.
    validations:
      required: false
