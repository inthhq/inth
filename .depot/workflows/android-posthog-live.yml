# Manual check that the Android consent demo sends PostHog events to a real
# project only while measurement is granted. Every other Android suite points
# the vendor SDKs at a local capture server; this one cannot count traffic
# itself, so it uploads a run id for the PostHog query described in
# examples/native/consent-demo/README.md.
#
# Manual dispatch only, on main. Scope the Depot CI secret
# POSTHOG_E2E_PROJECT_KEY to this repository, the main branch and this
# workflow file; Depot CI does not run pull requests from forks. Without the
# secret the job reports a notice and skips. Do not add pull_request, push or
# schedule triggers.
name: Android live PostHog consent

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-posthog-live-${{ github.run_id }}
  cancel-in-progress: false

env:
  C15T_ANDROID_IMAGE: system-images;android-36;google_apis;x86_64
  C15T_ANDROID_ARCH: x86_64
  # The "events-sdk e2e" project (305107) is on PostHog EU Cloud.
  POSTHOG_E2E_HOST: https://eu.i.posthog.com

jobs:
  posthog-live:
    name: Consent demo against live PostHog
    # Belt and braces for the trigger list above: never run for a pull request
    # event. `depot ci run` from a working tree reports its own event name, so
    # this cannot require workflow_dispatch.
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Choose the run id
        id: run
        env:
          POSTHOG_E2E_PROJECT_KEY: ${{ secrets.POSTHOG_E2E_PROJECT_KEY }}
        run: |
          # Skip before the emulator boots when the secret is not configured.
          if [[ -z "${POSTHOG_E2E_PROJECT_KEY}" ]]; then
            echo "::notice::POSTHOG_E2E_PROJECT_KEY is not configured; skipping the live PostHog check."
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"
          run_id="inth-android-$(date -u +%Y%m%dT%H%M%SZ)-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "PostHog run_id: ${run_id} (event: ${GITHUB_EVENT_NAME})"
      - name: Prepare the Android toolchain
        if: steps.run.outputs.available == 'true'
        run: bash .depot/android-toolchain.sh
      - name: Boot the emulator
        if: steps.run.outputs.available == 'true'
        id: boot
        run: bash scripts/ci-android-emulator.sh start
      - name: Live PostHog journey
        if: steps.run.outputs.available == 'true'
        env:
          POSTHOG_E2E_PROJECT_KEY: ${{ secrets.POSTHOG_E2E_PROJECT_KEY }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          # Keep the whole run in logcat for the evidence step.
          adb logcat -G 8M
          adb logcat -c
          sh packages/android/gradlew -p packages/android --no-build-cache :consent-demo:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.inth.demo.RealVendorSdkTest#posthogLiveFollowsConsent \
            "-Pandroid.testInstrumentationRunnerArguments.inthPostHogLiveHost=${POSTHOG_E2E_HOST}" \
            "-Pandroid.testInstrumentationRunnerArguments.inthPostHogLiveKey=${POSTHOG_E2E_PROJECT_KEY}" \
            "-Pandroid.testInstrumentationRunnerArguments.inthPostHogLiveRunId=${RUN_ID}"
      - name: Collect the evidence
        if: ${{ always() && steps.boot.outcome != 'skipped' }}
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          out="${RUNNER_TEMP}/posthog-live"
          mkdir -p "${out}"
          adb logcat -d -s inth-vendor-evidence:I > "${out}/evidence.log" || true
          grep -o 'posthog-live evidence .*' "${out}/evidence.log" | sed 's/^posthog-live evidence //' | tail -1 > "${out}/evidence.json" || true
          {
            echo "## Live PostHog consent check"
            echo
            echo "- run_id: \`${RUN_ID}\`"
            echo "- host: ${POSTHOG_E2E_HOST} (project 305107)"
            echo
            echo "Expected: one \`inth_probe\` event with \`step=granted\`, and none with \`fresh\`, \`rejected\`, \`withdrawn\` or \`relaunched\`."
            echo "Check it with the query in examples/native/consent-demo/README.md."
            echo
            echo '```'
            grep 'posthog-live' "${out}/evidence.log" | sed 's/^.*inth-vendor-evidence: //' || echo "no evidence logged"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Stop the emulator
        if: ${{ always() && steps.boot.outcome != 'skipped' }}
        run: bash scripts/ci-android-emulator.sh stop
      - name: Upload the evidence and test reports
        if: always() && steps.run.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-posthog-live-${{ steps.run.outputs.id }}
          path: |
            ${{ runner.temp }}/posthog-live/**
            examples/native/consent-demo/android/build/reports/androidTests/**
            examples/native/consent-demo/android/build/outputs/androidTest-results/**
            ${{ runner.temp }}/android-emulator/*.log
          if-no-files-found: warn
          retention-days: 30
